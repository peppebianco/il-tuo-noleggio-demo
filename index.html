<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Tuo Noleggio — Gestionale Demo</title>
<meta name="description" content="Demo interattiva del gestionale per il noleggio auto e scooter.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-logo-wrap">
      <div class="login-wordmark">IL TUO<br>NOLEGGIO</div>
      <div class="login-wordmark-sub">RENTAL CAR &amp; SCOOTER</div>
    </div>

    <h1 class="login-title">Area Admin</h1>
    <p class="login-sub">Inserisci le tue credenziali per accedere</p>

    <form class="login-form" id="loginForm">
      <div class="form-field">
        <label for="loginEmail">Email</label>
        <div class="login-field-wrap">
          <span class="material-symbols-outlined">mail</span>
          <input type="email" id="loginEmail" placeholder="nome@esempio.com" autocomplete="username" required>
        </div>
      </div>
      <div class="form-field">
        <label for="loginPassword">Password</label>
        <div class="login-field-wrap">
          <span class="material-symbols-outlined">lock</span>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" required>
        </div>
      </div>
      <div class="login-error hidden" id="loginError">
        <span class="material-symbols-outlined">error</span> Email o password non corretti.
      </div>
      <button type="submit" class="btn-primary login-submit">
        <span class="material-symbols-outlined">login</span> Accedi
      </button>
    </form>

    <div class="login-divider"></div>
    <p class="login-footer">© 2026 Il Tuo Noleggio. Riservato al personale autorizzato.</p>
  </div>
</div>

<div class="app-shell hidden" id="appShell">

  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-logo">🚗</div>
      <div class="brand-text">
        <div class="brand-name">IL TUO<br>NOLEGGIO</div>
        <div class="brand-sub">RENTAL CAR &amp; SCOOTER</div>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button class="nav-item" data-view="pianificazione">
        <span class="material-symbols-outlined">grid_view</span>
        <span>Pianificazione</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
      <button class="nav-item" data-view="logistica">
        <span class="material-symbols-outlined">local_shipping</span>
        <span>Logistica</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
      <button class="nav-item" data-view="attivi">
        <span class="material-symbols-outlined">key</span>
        <span>Noleggi Attivi</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
      <button class="nav-item" data-view="prenotazioni">
        <span class="material-symbols-outlined">calendar_month</span>
        <span>Prenotazioni</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
      <button class="nav-item" data-view="sospeso">
        <span class="material-symbols-outlined">schedule</span>
        <span>In Sospeso</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
      <button class="nav-item" data-view="inventario">
        <span class="material-symbols-outlined">directions_car</span>
        <span>Inventario</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
      <button class="nav-item" data-view="voucher">
        <span class="material-symbols-outlined">confirmation_number</span>
        <span>Voucher</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
      <button class="nav-item" data-view="analytics">
        <span class="material-symbols-outlined">bar_chart</span>
        <span>Analytics</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
      <button class="nav-item" data-view="clienti">
        <span class="material-symbols-outlined">group</span>
        <span>Clienti</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
      <button class="nav-item" data-view="partner">
        <span class="material-symbols-outlined">handshake</span>
        <span>Partner</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
      <button class="nav-item" data-view="recensioni">
        <span class="material-symbols-outlined">star</span>
        <span>Recensioni</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
      <button class="nav-item" data-view="chat">
        <span class="material-symbols-outlined">forum</span>
        <span>Chat Clienti</span>
        <span class="material-symbols-outlined nav-chevron">chevron_right</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="user-card" id="userMenuBtn">
        <div class="avatar">S</div>
        <div class="user-info">
          <div class="user-name">Sara Moretti</div>
          <div class="user-email">sara@iltuonoleggio.demo</div>
        </div>
      </div>
      <button class="btn-logout" id="logoutBtn">
        <span class="material-symbols-outlined">logout</span>
        Esci
      </button>
    </div>
  </aside>

  <button class="mobile-nav-toggle" id="mobileNavToggle" aria-label="Apri menu">
    <span class="material-symbols-outlined">menu</span>
  </button>

  <div class="main">
    <header class="topbar">
      <div class="search-wrap">
        <span class="material-symbols-outlined">search</span>
        <input type="text" id="globalSearch" placeholder="Cerca prenotazioni, clienti, veicoli...">
      </div>
      <div class="topbar-actions">
        <button class="btn-primary" id="newBookingBtn">
          <span class="material-symbols-outlined">add</span>
          Nuova Prenotazione
        </button>
        <div class="notif-wrap">
          <button class="icon-btn" id="notifBtn">
            <span class="material-symbols-outlined">notifications</span>
            <span class="notif-dot"></span>
          </button>
          <div class="notif-panel hidden" id="notifPanel"></div>
        </div>
      </div>
    </header>

    <main class="view-root" id="viewRoot"></main>
  </div>
</div>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<div class="toast-stack" id="toastStack"></div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="js/data.js?v=5"></script>
<script src="js/utils.js?v=5"></script>
<script src="js/wizard.js?v=5"></script>
<script src="js/views.js?v=5"></script>
<script src="js/app.js?v=5"></script>
<script src="js/auth.js?v=5"></script>
</body>
</html>
